<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Vittora Credit Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky brand bar + tab strip over a 12-column panel grid (max 1240px); each page = heading, stat tiles, then panels. */
:root {
  --page: #f6f6f2;
  --surface: #fdfdfb;
  --surface-2: #f0efe9;
  --ink: #121315;
  --ink-2: #4c4e52;
  --muted: #84858a;
  --grid: #e5e4dd;
  --line: #d9d8d0;
  --accent: #2a78d6;
  --accent-ink: #1d5fb0;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --de: #c9c8c2;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --good-ink: #0a6e0a; --warn-ink: #8a5a00; --crit-ink: #b42525;
  --sev1: #f3c590; --sev2: #ec8b4c; --sev3: #d4552b; --sev4: #9e3417;
  --seq0: #e6effb; --seq1: #cde2fb; --seq2: #9ec5f4; --seq3: #6da7ec;
  --seq4: #3987e5; --seq5: #2a78d6; --seq6: #1c5cab; --seq7: #104281;
  --seq-ink-lo: #121315; --seq-ink-hi: #ffffff;
  --band: rgba(42, 120, 214, 0.08);
  --tip-shadow: 0 8px 28px rgba(18, 19, 21, 0.14);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0e0e0d; --surface: #181817; --surface-2: #20201e; --ink: #f3f3ef; --ink-2: #c6c5bb;
    --muted: #8e8d86; --grid: #2a2a28; --line: #35352f; --accent: #3987e5; --accent-ink: #86b6ef;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #2c962c; --s7: #9085e9; --s8: #e66767;
    --de: #4b4b47; --good-ink: #3fc43f; --warn-ink: #fab219; --crit-ink: #f08a8a;
    --sev1: #6b4520; --sev2: #a75a2b; --sev3: #dd6d3c; --sev4: #f39a6c;
    --seq0: #172231; --seq1: #1a2c45; --seq2: #1e3a5f; --seq3: #234c7e; --seq4: #2a63a6; --seq5: #3987e5; --seq6: #6da7ec; --seq7: #a9cbf5;
    --seq-ink-lo: #e9eef6; --seq-ink-hi: #0b0d10; --band: rgba(57, 135, 229, 0.15); --tip-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0e0e0d; --surface: #181817; --surface-2: #20201e; --ink: #f3f3ef; --ink-2: #c6c5bb;
  --muted: #8e8d86; --grid: #2a2a28; --line: #35352f; --accent: #3987e5; --accent-ink: #86b6ef;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #2c962c; --s7: #9085e9; --s8: #e66767;
  --de: #4b4b47; --good-ink: #3fc43f; --warn-ink: #fab219; --crit-ink: #f08a8a;
  --sev1: #6b4520; --sev2: #a75a2b; --sev3: #dd6d3c; --sev4: #f39a6c;
  --seq0: #172231; --seq1: #1a2c45; --seq2: #1e3a5f; --seq3: #234c7e; --seq4: #2a63a6; --seq5: #3987e5; --seq6: #6da7ec; --seq7: #a9cbf5;
  --seq-ink-lo: #e9eef6; --seq-ink-hi: #0b0d10; --band: rgba(57, 135, 229, 0.15); --tip-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--font-ui); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 28px); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--page); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding-block: 12px 4px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand-name { font: 700 19px/1.1 var(--font-display); letter-spacing: -0.01em; }
.brand-sub { color: var(--ink-2); font-size: 12.5px; }
.meta { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.badge b { color: var(--ink); font-weight: 600; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; border: 0; background: none; font: 500 13.5px var(--font-ui); color: var(--ink-2); padding: 9px 12px 10px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
button:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.btn-ghost { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: 500 12px var(--font-ui); border-radius: 6px; padding: 3px 9px; cursor: pointer; white-space: nowrap; }
.btn-ghost:hover, .btn-ghost[aria-pressed="true"] { color: var(--ink); border-color: var(--muted); }
main { padding-block: 22px 36px; }
.page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 16px; }
.page-head h1 { font: 700 27px/1.15 var(--font-display); margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
.page-head p { margin: 0; color: var(--ink-2); max-width: 72ch; text-wrap: pretty; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tile .k { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
.tile .d { font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 20px; margin-bottom: 4px; }
.tile .spark { height: 34px; margin-top: auto; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; }
.span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }
@media (max-width: 980px) { .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column: span 12; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.panel-h { display: flex; align-items: flex-start; gap: 12px; }
.panel-h > div:first-child { min-width: 0; }
.panel-h h2 { font: 600 15px/1.3 var(--font-ui); margin: 0; }
.panel-h p { margin: 2px 0 0; color: var(--ink-2); font-size: 12.5px; }
/* Panels in a row share one height; the body flexes so charts (and stretchable tables) fill it. */
.panel-b { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.panel-b[hidden] { display: none; }
.panel-b > p { margin: 0; }
.panel-b > .push { margin-top: auto; }
.fill-col { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stack > .panel:last-child { flex: 1 1 auto; }
.tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chart { width: 100%; min-width: 0; }
.chart svg { display: block; overflow: visible; }
.chart.fill { flex: 1 1 auto; position: relative; }
.chart.fill > svg { position: absolute; left: 0; top: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; }
svg text { font-family: var(--font-ui); }
svg text.ax { fill: var(--muted); font-size: 11px; }
svg text.lbl { fill: var(--ink-2); font-size: 12px; }
svg text.val { fill: var(--ink); font-size: 12px; font-weight: 600; }
svg text.sub { fill: var(--muted); font-size: 11px; }
svg .gl { stroke: var(--grid); stroke-width: 1; }
svg .base { stroke: var(--muted); stroke-width: 1; }
svg .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .hair { stroke: var(--muted); stroke-width: 1; }
svg .hit { fill: transparent; cursor: crosshair; }
svg .rowhit { fill: transparent; cursor: default; }
svg .rowhit:hover { fill: var(--band); }
svg .band { fill: var(--band); }
svg .mark-line { stroke: var(--muted); stroke-width: 1; }
svg .ring { stroke: var(--surface); stroke-width: 2; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; box-shadow: var(--tip-shadow); font-size: 12px; min-width: 150px; max-width: 300px; }
.tip .t { color: var(--ink-2); margin-bottom: 4px; font-size: 11.5px; }
.tip .r { display: flex; align-items: center; gap: 8px; line-height: 1.65; }
.tip .r b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .r span { color: var(--ink-2); }
.tip .r i { width: 12px; height: 2px; border-radius: 1px; display: inline-block; flex: none; }
.tbl-wrap { overflow-x: auto; min-width: 0; }
.tbl-wrap.fill { flex: 1 1 auto; display: flex; flex-direction: column; }
.tbl-wrap.fill > table { flex: 1 1 auto; }
/* long tables scroll inside a fixed box that still grows with its row */
.tbl-wrap.scroll { flex: 1 1 auto; height: 360px; overflow: auto; }
table.t td.brk { overflow-wrap: break-word; }
.tbl-wrap.scroll thead th { position: sticky; top: 0; z-index: 1; background: var(--surface); box-shadow: inset 0 -1px 0 var(--line); }
table.t.wrap-head th { white-space: normal; vertical-align: bottom; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: left; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--line); padding: 6px 8px; white-space: nowrap; font-size: 12px; }
table.t td { padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.t .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 500; white-space: nowrap; background: color-mix(in srgb, var(--muted) 15%, transparent); color: var(--ink-2); }
.chip.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good-ink); }
.chip.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn-ink); }
.chip.crit { background: color-mix(in srgb, var(--crit) 14%, transparent); color: var(--crit-ink); }
.chip.accent { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent-ink); }
.delta { font-weight: 500; }
.delta.good { color: var(--good-ink); } .delta.crit { color: var(--crit-ink); } .delta.neutral { color: var(--ink-2); }
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; margin-bottom: 16px; }
@media (max-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero-fig { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hero-fig .k { color: var(--ink-2); font-size: 13px; }
.hero-fig .big { font-size: clamp(40px, 6vw, 56px); font-weight: 600; letter-spacing: -0.025em; line-height: 1.05; }
.hero-fig .strip { margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-top: 12px; border-top: 1px solid var(--grid); }
.hero-fig .strip .k { font-size: 12px; }
.hero-fig .strip .v { font-size: 17px; font-weight: 600; line-height: 1.3; }
.summary { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.summary .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.summary .k { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.summary blockquote { margin: 0; font-size: 15.5px; line-height: 1.45; font-weight: 500; text-wrap: pretty; }
.summary ul { margin: 0; padding-left: 18px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.cite { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); margin-left: 4px; }
.list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--grid); padding-bottom: 7px; min-width: 0; }
.list li:last-child { border-bottom: 0; padding-bottom: 0; }
.list .lt { min-width: 0; }
.list .rt { display: flex; gap: 6px; align-items: baseline; flex: none; font-variant-numeric: tabular-nums; }
.list small { display: block; color: var(--ink-2); font-size: 12px; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font: 500 12px var(--font-ui); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.heat { border-collapse: separate; border-spacing: 2px; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.heat th { color: var(--muted); font-weight: 500; padding: 2px 6px; text-align: right; white-space: nowrap; }
.heat thead th { text-align: center; }
.heat td { text-align: center; padding: 5px 4px; border-radius: 3px; min-width: 36px; }
.heat td.m0 { background: var(--surface-2); color: var(--muted); }
.scale { display: flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--muted); }
.scale i { width: 16px; height: 10px; border-radius: 2px; display: inline-block; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; margin: 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 16px; }
.stats .k { font-size: 12px; color: var(--ink-2); }
.stats .v { font-size: 20px; font-weight: 600; line-height: 1.25; }
.stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.foot { color: var(--muted); font-size: 12px; padding-block: 10px 28px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: no-preference) {
  .tile, .panel, .hero-fig, .summary { animation: rise 0.3s ease both; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" style="fill: var(--accent)"></rect><path d="M7.5 8.5 L14 20 L20.5 8.5" style="fill: none; stroke: var(--surface); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"></path></svg>
        <div>
          <div class="brand-name">Vittora Credit</div>
          <div class="brand-sub">Product analytics &amp; decision intelligence</div>
        </div>
      </div>
      <div class="meta">
        <span class="badge" id="asof"></span>
        <span class="badge">Synthetic data</span>
        <button class="btn-ghost" id="theme" type="button" aria-label="Switch colour theme">Theme: auto</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Dashboard pages" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="page"></main>
<footer class="wrap foot" id="foot"></footer>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script id="dash-data" type="application/json">/*__DASHBOARD_DATA__*/null</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("dash-data").textContent);
  var NS = "http://www.w3.org/2000/svg";
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var K = {}; D.kpis.forEach(function (k) { K[k.id] = k; });
  var M = D.monthly;
  var observers = [];

  // ------------------------------------------------------------------ formatting
  function ym(s) { var p = String(s).slice(0, 7).split("-"); return MON[+p[1] - 1] + " " + p[0]; }
  function ymShort(s) { var p = String(s).slice(0, 7).split("-"); return MON[+p[1] - 1] + " " + p[0].slice(2); }
  function dmy(s) { var p = String(s).slice(0, 10).split("-"); return +p[2] + " " + MON[+p[1] - 1] + " " + p[0]; }
  function dm(s) { var p = String(s).slice(0, 10).split("-"); return +p[2] + " " + MON[+p[1] - 1]; }
  function isNum(v) { return v !== null && v !== undefined && !isNaN(v); }
  function int(v) { return isNum(v) ? Math.round(v).toLocaleString("en-IN") : "n/a"; }
  function pctR(v, d) { return isNum(v) ? (v * 100).toFixed(d == null ? 1 : d) + "%" : "n/a"; }
  function pct(v, d) { return isNum(v) ? (+v).toFixed(d == null ? 1 : d) + "%" : "n/a"; }
  function signed(v, d, unit) { if (!isNum(v)) return "n/a"; return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + (unit || ""); }
  function inr(v) {
    if (!isNum(v)) return "n/a";
    var a = Math.abs(v), s = v < 0 ? "−" : "";
    if (a >= 1e7) return s + "₹" + (a / 1e7).toFixed(2) + " Cr";
    if (a >= 1e5) return s + "₹" + (a / 1e5).toFixed(2) + " L";
    return s + "₹" + Math.round(a).toLocaleString("en-IN");
  }
  function inrAxis(v) {
    var a = Math.abs(v), s = v < 0 ? "−" : "";
    if (a >= 1e7) return s + "₹" + +(a / 1e7).toFixed(1) + "Cr";
    if (a >= 1e5) return s + "₹" + +(a / 1e5).toFixed(1) + "L";
    if (a >= 1e3) return s + "₹" + +(a / 1e3).toFixed(0) + "k";
    return s + "₹" + Math.round(a);
  }
  function fmtK(k, v) {
    if (k.unit === "pct") return pctR(v);
    if (k.unit === "inr") return inr(v);
    if (k.unit === "count") return int(v);
    return isNum(v) ? (+v).toFixed(2) : "n/a";
  }
  function pretty(s) {
    var map = { emi_calculator: "EMI calculator", new_to_credit: "New to credit", has_bureau_score: "Has bureau score", tier_1: "Tier 1", tier_2: "Tier 2", tier_3: "Tier 3", ios: "iOS", web: "Web", android: "Android" };
    if (map[s]) return map[s];
    s = String(s).replace(/_/g, " ");
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function productName(id) { var p = D.products.filter(function (x) { return x.product_id === id; })[0]; return p ? p.product_name : id; }

  // ------------------------------------------------------------------ DOM helpers
  function h(tag, attrs) {
    var e = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    (function add(list) {

    var dc = D.deciles;
    var dp = panel(6, "Value concentration", "Share of net revenue by borrower decile (D1 = most valuable 10%)", {
      table: function () { return { cols: [{ label: "Decile", get: function (r) { return "D" + r.decile; } }, { label: "Borrowers", num: true, get: function (r) { return int(r.borrowers); } }, { label: "Share", num: true, get: function (r) { return pct(r.share_of_net_revenue_pct); } }, { label: "Cumulative", num: true, get: function (r) { return pct(r.cumulative_share_pct); } }], rows: dc }; } });
    columnPanel(dp.body, 240, { labels: dc.map(function (r) { return "D" + r.decile; }), yFmt: function (v) { return v + "%"; }, tipFmt: function (v) { return pct(v); },
        series: [{ name: "Share of net revenue", values: dc.map(function (r) { return r.share_of_net_revenue_pct; }), color: "var(--s1)" }],
        extraTip: function (i) { return [{ label: "cumulative share", value: pct(dc[i].cumulative_share_pct) }]; } });
    grid.append(dp.el);

    var cl = D.clusters.slice().sort(function (a, b) { return b.share_of_net_revenue_pct - a.share_of_net_revenue_pct; }), km = D.kmeans || {};
    var kp = panel(12, "Borrower segments (K-Means)", "k = " + km.k + " on 11 behaviour and value features · silhouette " + km.silhouette + " · seed stability (ARI) " + km.stability_ari_mean);
    kp.body.append(legend([{ label: "Share of borrowers", color: "var(--s2)" }, { label: "Share of net revenue", color: "var(--s1)" }]));
    barPanel(kp.body, { series: [{ name: "Share of borrowers", color: "var(--s2)" }, { name: "Share of net revenue", color: "var(--s1)" }], fmt: function (v) { return pct(v, 1); }, axisFmt: function (v) { return pct(v, 0); }, labelW: 190,
        rows: cl.map(function (r) { return { label: r.cluster_name, values: [r.share_of_borrowers_pct, r.share_of_net_revenue_pct] }; }) });
    kp.body.append(h("div", { "class": "tbl-wrap" }, makeTable({ cols: [
      { label: "Segment", get: function (r) { return r.cluster_name; } },
      { label: "Borrowers", num: true, get: function (r) { return int(r.borrowers); } },
      { label: "Avg loans", num: true, get: function (r) { return (+r.n_loans).toFixed(2); } },
      { label: "On-time", num: true, get: function (r) { return pctR(r.on_time_rate, 0); } },
      { label: "Recommended action", get: function (r) { return r.recommended_action; } }], rows: cl })));
    grid.append(kp.el);
  }

  function expOrder() { return ["EXP-ONB-2026-01", "EXP-RPY-2025-11", "EXP-PRC-2025-06"].filter(function (id) { return D.experiments[id]; }); }
  function expMeta(id) { return D.experiments_meta.filter(function (m) { return m.experiment_id === id; })[0] || {}; }
  function decisionChip(d) {
    var t = String(d || "");
    if (t.indexOf("SHIP") === 0) return chip("✓ " + (t.indexOf("monitor") > 0 ? "Ship + monitor" : "Ship"), "good");
    if (t.indexOf("DO NOT") === 0) return chip("✕ Do not ship", "crit");
    if (t.indexOf("INCONCLUSIVE") === 0) return chip("● Inconclusive", "warn");
    return chip(t.split(" ")[0] || "n/a", "");
  }
  var metricLabels = { kyc_completion_7d: "KYC completed in 7 days", application_submitted_14d: "Application in 14 days", loan_disbursed_30d: "First loan in 30 days", approval_rate: "Approval rate", fpd30_rate: "FPD30 rate", kyc_support_ticket_rate: "KYC support tickets", autopay: "Autopay enabled", first_emi_on_time: "First EMI on time", accepted: "Offer accepted" };

  function pageExperiments(main) {
    main.append(pageHead("Experiment analysis", "Pre-registered A/B tests: validity checks, effect sizes with confidence intervals, guardrails and the decision"));
    var pills = h("div", { "class": "seg", role: "group", "aria-label": "Experiment" }), holder = h("div");
    main.append(h("div", { style: "margin-bottom:14px" }, pills), holder);
    function draw(id) {
      holder.replaceChildren();
      var r = D.experiments[id], meta = expMeta(id), p = r.primary, grid = h("div", { "class": "grid" });
      holder.append(grid);
      var primaryName = metricLabels[r.primary_metric || "kyc_completion_7d"] || r.primary_metric;
      var hd = panel(12, meta.experiment_name || r.name, meta.hypothesis || "");
      hd.tools.append(decisionChip(r.decision));
      hd.body.append(h("p", { "class": "note", text: "Primary metric: " + primaryName }), h("div", { "class": "stats" },
        stat("Control", pctR(p.control_rate, 2), int(p.control_n) + " users"),
        stat("Treatment", pctR(p.treatment_rate, 2), int(p.treatment_n) + " users"),
        stat("Difference (95% CI)", signed(100 * p.diff_abs, 2, " pp"), signed(100 * p.ci_low, 2) + " to " + signed(100 * p.ci_high, 2) + " pp"),
        stat("p-value", p.p_value < 0.0001 ? "< 0.0001" : p.p_value.toFixed(4), p.significant ? "significant at 5%" : "not significant"),
        stat("P(treatment better)", pctR(r.bayesian.prob_treatment_better, 1), "Beta-Binomial posterior"),
        stat("Sample ratio check", "p = " + r.srm.p_value.toFixed(3), r.srm.srm_detected ? "mismatch detected" : "no mismatch (alarm < 0.001)")));
      hd.body.append(h("p", { "class": "note", text: id + " · " + dmy(meta.start_date) + " to " + dmy(meta.end_date) + " · owner: " + (meta.owner_team || "") + " · decision: " + r.decision }));
      grid.append(hd.el);

      var rows = [{ label: primaryName, sub: "primary", m: p }];
      Object.keys(r.secondary || {}).forEach(function (k) { rows.push({ label: metricLabels[k] || pretty(k), sub: "secondary", m: r.secondary[k] }); });
      Object.keys(r.guardrails || {}).forEach(function (k) { rows.push({ label: metricLabels[k] || pretty(k), sub: "guardrail, " + (r.guardrails[k].higher_is_worse ? "lower" : "higher") + " is better", m: r.guardrails[k], status: r.guardrails[k].status }); });
      var fp = panel(7, "Effect sizes", "Treatment − control in percentage points, 95% CI; blue = significant at 5%");
      forestPanel(fp.body, rows.map(function (x) {
          return { label: x.label, sub: x.sub, d: 100 * x.m.diff_abs, lo: 100 * x.m.ci_low, hi: 100 * x.m.ci_high, sig: x.m.significant,
            right: signed(100 * x.m.diff_abs, 2, " pp") + (x.status ? " · " + x.status : " · p " + (x.m.p_value < 0.001 ? "<0.001" : x.m.p_value.toFixed(3))),
            tip: [{ label: "control", value: pctR(x.m.control_rate, 2) }, { label: "treatment", value: pctR(x.m.treatment_rate, 2) }, { label: "p-value", value: x.m.p_value.toFixed(4) }].concat(x.status ? [{ label: "guardrail", value: x.status + " (margin " + (100 * x.m.margin).toFixed(1) + " pp)" }] : []) };
        }));
      grid.append(fp.el);

      var dz = panel(5, "Design and power", "Sized before launch; checked after");
      var d = r.design || {}, kv = h("dl", { "class": "kv" });
      function add(k, v) { kv.append(h("dt", { text: k }), h("dd", { text: v })); }
      if (d.pre_period_baseline) add("Baseline (pre-period)", pctR(d.pre_period_baseline, 1));
      add("Minimum detectable effect", (100 * (d.planned_mde_abs || r.planned_mde_abs)).toFixed(1) + " pp");
      add("Required users per arm", int(d.required_n_per_arm || r.required_n_per_arm));
      if (d.weeks_needed) add("Weeks needed", d.weeks_needed + " at " + int(d.pre_period_weekly_app_signups) + " app signups/week");
      add("Realised users per arm", int(Math.min(p.control_n, p.treatment_n)));
      if (r.achieved_power_at_observed_effect) add("Power at observed effect", pctR(r.achieved_power_at_observed_effect, 0));
      add("MDE at realised sample", (100 * r.mde_at_realised_n).toFixed(2) + " pp");
      dz.body.append(kv);
      if (r.impact) dz.body.append(h("p", { "class": "note push", text: "Estimated impact at the post-launch run rate: ~" + int(r.impact.incremental_kyc_per_year) + " more verified customers and ~" + int(r.impact.incremental_first_loans_per_year) + " more first loans a year, about " + inr(r.impact.incremental_net_revenue_per_year) + " net revenue from first loans alone." }));
      grid.append(dz.el);

      if (r.weekly_effect && r.weekly_effect.length) {
        var wp = panel(6, "Effect by week of assignment", "Novelty check: does the lift fade after the first weeks?");
        forestPanel(wp.body, r.weekly_effect.map(function (x) { return { label: "Week of " + dm(x.assignment_week), d: 100 * x.diff_abs, lo: 100 * x.ci_low, hi: 100 * x.ci_high, sig: x.ci_low > 0 || x.ci_high < 0, tip: [{ label: "users", value: int(x.users) }] }; }), { rowH: 30 });
        grid.append(wp.el);
      }
      if (r.segments && r.segments.length) {
        var sp = panel(6, "Heterogeneity (exploratory)", "Holm-adjusted for multiple comparisons; not for targeting without a follow-up test");
        sp.body.append(h("div", { "class": "tbl-wrap fill" }, makeTable({ cols: [
          { label: "Segment", get: function (x) { return pretty(x.dimension) + ": " + pretty(x.segment); } },
          { label: "Users", num: true, get: function (x) { return int(x.users); } },
          { label: "Difference", num: true, get: function (x) { return signed(100 * x.diff_abs, 2, " pp"); } },
          { label: "Holm p", num: true, get: function (x) { return x.p_value_holm.toFixed(3); } }], rows: r.segments })));
        grid.append(sp.el);
      }
    }
    expOrder().forEach(function (id, i) {
      var b = h("button", { type: "button", "aria-pressed": i === 0 ? "true" : "false", text: (expMeta(id).experiment_name || id) });
      b.addEventListener("click", function () { pills.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); }); b.setAttribute("aria-pressed", "true"); draw(id); });
      pills.append(b);
    });
    if (expOrder().length) draw(expOrder()[0]);
  }

  function pageQuality(main) {
    var q = D.dq, sm = q.summary || {}, raw = sm.raw || {}, cl = sm.clean || {}, rc = sm.recall || {};
    main.append(pageHead("Data quality", "Contract-driven checks on the raw extract and the curated layer; critical failures block publishing"));
    main.append(tiles([
      customTile("DQ score", (raw.dq_score || 0).toFixed(1) + " → " + (cl.dq_score || 0).toFixed(1), h("span", { "class": "note", text: "raw → curated, weighted pass rate" })),
      customTile("Critical failures", (raw.critical_failures || 0) + " → " + (cl.critical_failures || 0), cl.critical_failures ? chip("Publishing blocked", "crit") : chip("✓ Certified", "good")),
      customTile("Warnings", (raw.warnings || 0) + " → " + (cl.warnings || 0), h("span", { "class": "note", text: "documented open issues" })),
      customTile("Planted defects caught", (rc.detected || 0) + " / " + (rc.total || 0), h("span", { "class": "note", text: "framework recall" })),
      customTile("Rows quarantined", int(q.quarantined), h("span", { "class": "note", text: "kept with a reason, not deleted" })),
      customTile("Checks per run", int(cl.checks_run), h("span", { "class": "note", text: "schema to reconciliation" }))]));
    var grid = h("div", { "class": "grid" });
    main.append(grid);

    var tables = Object.keys(Object.assign({}, q.failed_raw, q.failed_clean)).sort(function (a, b) { return ((q.failed_raw[b] || 0) + (q.failed_clean[b] || 0)) - ((q.failed_raw[a] || 0) + (q.failed_clean[a] || 0)); });
    var fp = panel(6, "Failed checks by table", "Critical and warning failures before and after ETL");
    fp.body.append(legend([{ label: "Raw extract", color: "var(--de)" }, { label: "Curated layer", color: "var(--s1)" }]));
    barPanel(fp.body, { series: [{ name: "Raw extract", color: "var(--de)" }, { name: "Curated layer", color: "var(--s1)" }], fmt: int, labelW: 170, rowH: 34,
        rows: tables.map(function (t) { return { label: t, values: [q.failed_raw[t] || 0, q.failed_clean[t] || 0] }; }) });
    grid.append(fp.el);

    var op = panel(6, "Open issues on the curated layer", "Published with a caveat; none are critical");
    op.body.append(h("div", { "class": "tbl-wrap fill" }, makeTable({ cols: [
      { label: "Severity", get: function (r) { return chip(r.severity, r.severity === "critical" ? "crit" : "warn"); } },
      { label: "Where", brk: true, get: function (r) { return r.table + "." + r.column; } },
      { label: "Check", brk: true, get: function (r) { return r.check; } },
      { label: "Rows", num: true, get: function (r) { return int(r.failed_rows); } }], rows: q.open_issues })));
    grid.append(op.el);

    var an = panel(12, "Anomaly episodes", "Seasonality-aware detector with driver attribution; known business events are labelled, the rest are incidents");
    var al = h("ul", { "class": "list" });
    D.anomalies.forEach(function (e) {
      al.append(h("li", null,
        h("span", { "class": "lt" }, e.metric_label + ", " + dmy(e.start) + (e.end !== e.start ? " to " + dmy(e.end) : ""), h("small", { text: e.headline })),
        h("span", { "class": "rt" }, e.known_context ? chip("Known event", "") : chip("Incident", "crit"))));
    });
    an.body.append(al);
    grid.append(an.el);

    var fixes = q.cleaning_log.filter(function (r) { return r.action !== "derive"; });
    var lg = panel(6, "ETL repair log", fixes.length + " repair rules changed data in this run");
    lg.body.append(h("div", { "class": "tbl-wrap scroll" }, makeTable({ cols: [
      { label: "Table", get: function (r) { return r.table; } },
      { label: "Rule", get: function (r) { return r.rule; } },
      { label: "Rows", num: true, get: function (r) { return int(r.rows_affected); } }], rows: fixes })));
    grid.append(lg.el);

    var rp = panel(6, "Planted-defect recall", "All " + q.recall.length + " defects the generator injected, and whether a check caught each one");
    rp.body.append(h("div", { "class": "tbl-wrap scroll" }, makeTable({ cols: [
      { label: "Defect", get: function (r) { return r.issue; } },
      { label: "Where", get: function (r) { return r.table + "." + r.column; } },
      { label: "Caught", get: function (r) { return r.detected ? chip("✓ yes", "good") : chip("✕ no", "crit"); } }], rows: q.recall })));
    grid.append(rp.el);
  }

  // ------------------------------------------------------------------ shell
  var PAGES = [
    { id: "overview", label: "Overview", render: pageOverview },
    { id: "funnel", label: "Funnel", render: pageFunnel },
    { id: "product", label: "Product", render: pageProduct },
    { id: "cohorts", label: "Cohorts", render: pageCohorts },
    { id: "portfolio", label: "Portfolio", render: pagePortfolio },
    { id: "revenue", label: "Revenue", render: pageRevenue },
    { id: "experiments", label: "Experiments", render: pageExperiments },
    { id: "quality", label: "Data quality", render: pageQuality }
  ];
  var tabsEl = document.getElementById("tabs"), main = document.getElementById("page");
  function show(id, push) {
    var pg = PAGES.filter(function (p) { return p.id === id; })[0] || PAGES[0];
    observers.forEach(function (o) { o.disconnect(); }); observers = [];
    hideTip();
    tabsEl.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-selected", String(t.dataset.id === pg.id)); t.tabIndex = t.dataset.id === pg.id ? 0 : -1; });
    main.replaceChildren();
    pg.render(main);
    try { localStorage.setItem("vittora-tab", pg.id); } catch (e) { /* storage unavailable */ }
    if (push) { try { history.replaceState(null, "", "#" + pg.id); } catch (e) { /* sandboxed */ } }
  }
  PAGES.forEach(function (p) {
    var b = h("button", { "class": "tab", role: "tab", type: "button", text: p.label, "data-id": p.id });
    b.addEventListener("click", function () { show(p.id, true); window.scrollTo(0, 0); });
    tabsEl.append(b);
  });
  tabsEl.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var ids = PAGES.map(function (p) { return p.id; }), cur = ids.indexOf((tabsEl.querySelector('[aria-selected="true"]') || {}).dataset.id);
    var nxt = ids[(cur + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length];
    show(nxt, true);
    tabsEl.querySelector('[data-id="' + nxt + '"]').focus();
  });

  var root = document.documentElement, themeBtn = document.getElementById("theme"), modes = ["auto", "light", "dark"];
  function applyTheme(m) {
    if (m === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", m);
    themeBtn.textContent = "Theme: " + m;
  }
  var saved = null;
  try { saved = localStorage.getItem("vittora-theme"); } catch (e) { saved = null; }
  if (saved && modes.indexOf(saved) >= 0) applyTheme(saved);
  themeBtn.addEventListener("click", function () {
    var cur = root.getAttribute("data-theme") || "auto", next = modes[(modes.indexOf(cur) + 1) % modes.length];
    applyTheme(next);
    try { localStorage.setItem("vittora-theme", next); } catch (e) { /* storage unavailable */ }
  });

  document.getElementById("asof").replaceChildren("Data as of ", h("b", { text: dmy(D.meta.as_of) }));
  document.getElementById("foot").textContent = "Vittora Credit is fictional and every figure is synthetic (" + int(D.meta.total_rows) + " generated rows, " + dmy(D.meta.start) + " to " + dmy(D.meta.as_of) + "). Built " + D.meta.built + " by the FinTech Product Analytics & Decision Intelligence Platform pipeline.";
  var start = (location.hash || "").replace("#", "");
  if (!PAGES.some(function (p) { return p.id === start; })) { try { start = localStorage.getItem("vittora-tab") || "overview"; } catch (e) { start = "overview"; } }
  show(start, false);
})();
</script>
<!--FRAGMENT-END-->
</body>
</html>
