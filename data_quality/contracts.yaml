# ---------------------------------------------------------------------------
# Data contracts - the single source of truth for schema, types and DQ rules.
#
# Consumed by:
#   * data_quality/runner.py      -> automated checks on raw and curated layers
#   * etl/transform.py            -> type casting of the curated (processed) layer
#   * python/build_data_dictionary.py -> docs/data_dictionary.md
#   * tests/test_contracts.py     -> asserts the warehouse DDL matches these contracts
#
# Column keys: type, nullable, description, accepted_values, min, max, pattern, fk,
#              outlier (robust z-score check), severity (critical|warning), derived
#              (column created by ETL; skipped on the raw layer)
# Severity: "critical" failures on the curated layer stop the pipeline before publishing.
# ALL DATA IS SYNTHETIC.
# ---------------------------------------------------------------------------
version: "1.4.0"
owner: "Analytics Engineering"
as_of_tolerance_days: 2

types:
  string: VARCHAR
  integer: BIGINT
  float: DOUBLE
  money: DECIMAL(18,2)
  timestamp: TIMESTAMP
  date: DATE
  boolean: BOOLEAN

tables:
  products:
    description: "Lending product catalogue (7 products). Source: product configuration service."
    source_system: "Product config"
    grain: "One row per product"
    primary_key: [product_id]
    columns:
      product_id: {type: string, nullable: false, pattern: '^P\d{2}$', description: "Product identifier (P01-P07)"}
      product_name: {type: string, nullable: false, description: "Customer-facing product name"}
      product_category: {type: string, nullable: false, accepted_values: [personal_loan, salary_advance, bnpl, consumer_durable, business_loan, p2p_loan, credit_line], description: "Product family"}
      min_amount: {type: money, nullable: false, min: 0, description: "Minimum sanctionable principal (INR)"}
      max_amount: {type: money, nullable: false, min: 0, description: "Maximum sanctionable principal (INR)"}
      min_tenure_months: {type: integer, nullable: false, min: 1, max: 60, description: "Shortest tenure offered"}
      max_tenure_months: {type: integer, nullable: false, min: 1, max: 60, description: "Longest tenure offered"}
      base_apr_pct: {type: float, nullable: false, min: 0, max: 60, description: "Base annual percentage rate before risk-based pricing"}
      processing_fee_pct: {type: float, nullable: false, min: 0, max: 10, description: "Upfront processing fee as % of principal (deducted at disbursal)"}
      revenue_model: {type: string, nullable: false, accepted_values: [interest_and_fees, platform_fee], description: "interest_and_fees = balance-sheet lending; platform_fee = P2P (interest goes to lenders)"}
      launch_date: {type: date, nullable: false, description: "Date the product went live"}
      is_secured: {type: boolean, nullable: false, description: "Whether the product is collateralised"}
      is_active: {type: boolean, nullable: false, description: "Currently offered to new customers"}
    cross_field:
      - {name: amount_bounds, expr: "min_amount <= max_amount", severity: critical}
      - {name: tenure_bounds, expr: "min_tenure_months <= max_tenure_months", severity: critical}

  marketing_campaigns:
    description: "Paid acquisition campaigns with spend and delivery metrics. Source: marketing spend sheet + ad platforms."
    source_system: "Marketing"
    grain: "One row per campaign flight"
    primary_key: [campaign_id]
    columns:
      campaign_id: {type: string, nullable: false, pattern: '^CMP-', description: "Campaign identifier"}
      campaign_name: {type: string, nullable: false, description: "Human-readable campaign name"}
      channel: {type: string, nullable: false, accepted_values: [paid_search, paid_social, affiliate, referral, partnerships], description: "Acquisition channel"}
      objective: {type: string, nullable: false, accepted_values: [acquisition, referral, seasonal_acquisition], description: "Campaign objective"}
      target_product_id: {type: string, nullable: true, fk: products.product_id, description: "Product promoted (null = brand / multi-product)"}
      start_date: {type: date, nullable: false, description: "Flight start"}
      end_date: {type: date, nullable: false, description: "Flight end"}
      budget_inr: {type: money, nullable: false, min: 0, description: "Approved budget (INR)"}
      spend_inr: {type: money, nullable: false, min: 0, description: "Actual spend (INR)"}
      impressions: {type: integer, nullable: false, min: 0, description: "Ad impressions / referral link views"}
      clicks: {type: integer, nullable: false, min: 0, description: "Clicks / link opens"}
    date_order:
      - [start_date, end_date]
    cross_field:
      - {name: spend_within_budget, expr: "spend_inr <= 1.5 * budget_inr", severity: warning}
      - {name: clicks_le_impressions, expr: "clicks <= impressions", severity: warning}

  customers:
    description: "Customer master: acquisition, demographics, bureau data and KYC state. Source: CRM."
    source_system: "CRM"
    grain: "One row per customer"
    primary_key: [customer_id]
    freshness_column: signup_ts
    row_count_min: 1000
    columns:
      customer_id: {type: string, nullable: false, pattern: '^C\d{6}$', description: "Customer identifier"}
      signup_ts: {type: timestamp, nullable: false, description: "Account creation timestamp (IST)"}
      acquisition_channel: {type: string, nullable: false, accepted_values: [organic, paid_search, paid_social, affiliate, referral, partnerships], description: "Last-touch acquisition channel"}
      campaign_id: {type: string, nullable: true, fk: marketing_campaigns.campaign_id, description: "Attributed campaign (null for organic)"}
      signup_platform: {type: string, nullable: false, accepted_values: [android, ios, web], description: "Platform used at signup"}
      city: {type: string, nullable: false, severity: warning, description: "City of residence"}
      state: {type: string, nullable: false, description: "State / UT of residence"}
      city_tier: {type: string, nullable: false, accepted_values: [tier_1, tier_2, tier_3], description: "City tier (RBI-style population tiers)"}
      age: {type: integer, nullable: false, severity: warning, min: 18, max: 75, description: "Age in years at signup (impossible values are nulled by ETL)"}
      employment_type: {type: string, nullable: false, accepted_values: [salaried, self_employed, gig_worker, student], description: "Self-declared employment type"}
      monthly_income: {type: money, nullable: false, severity: warning, min: 1000, max: 1500000, outlier: true, description: "Self-declared monthly income (INR)"}
      credit_score: {type: integer, nullable: true, min: 300, max: 900, description: "Bureau score at signup (null = new-to-credit)"}
      kyc_status: {type: string, nullable: false, accepted_values: [not_started, pending, verified, failed], description: "Current KYC state"}
      kyc_started_ts: {type: timestamp, nullable: true, description: "First KYC step started"}
      kyc_completed_ts: {type: timestamp, nullable: true, description: "KYC verified (from KYC vendor callback)"}
      kyc_method: {type: string, nullable: true, accepted_values: [aadhaar_okyc, digilocker, ckyc, video_kyc], description: "Verification method used"}
      marketing_opt_in: {type: boolean, nullable: false, description: "Consented to marketing communication"}
      is_ntc: {type: boolean, nullable: false, derived: true, description: "New-to-credit flag (no bureau score in the source record)"}
    date_order:
      - [signup_ts, kyc_started_ts]
      - [kyc_started_ts, kyc_completed_ts]
    conditional:
      - {name: verified_has_timestamp, when: "kyc_status == 'verified'", require_not_null: kyc_completed_ts, severity: critical}

  applications:
    description: "Loan applications from start to decision. Source: loan origination system (LOS)."
    source_system: "LOS"
    grain: "One row per application"
    primary_key: [application_id]
    freshness_column: started_ts
    columns:
      application_id: {type: string, nullable: false, pattern: '^APP\d{7}$', description: "Application identifier"}
      customer_id: {type: string, nullable: false, fk: customers.customer_id, description: "Applicant"}
      product_id: {type: string, nullable: false, fk: products.product_id, description: "Product applied for"}
      started_ts: {type: timestamp, nullable: false, description: "Application started"}
      submitted_ts: {type: timestamp, nullable: true, description: "Application submitted for underwriting (null = abandoned/in progress)"}
      requested_amount: {type: money, nullable: false, min: 100, max: 1000000, description: "Requested principal (INR)"}
      requested_tenure_months: {type: integer, nullable: false, min: 1, max: 60, description: "Requested tenure"}
      loan_purpose: {type: string, nullable: false, description: "Declared purpose"}
      application_platform: {type: string, nullable: false, accepted_values: [android, ios, web], description: "Platform used to apply"}
      is_repeat_customer: {type: boolean, nullable: false, description: "Applicant had a previously repaid loan"}
      internal_risk_score: {type: float, nullable: true, min: 0, max: 100, description: "Model probability of default x100 (null if not submitted)"}
      risk_band: {type: string, nullable: true, accepted_values: [A, B, C, D, E], description: "Risk band derived from the score (A = lowest risk)"}
      decision: {type: string, nullable: true, accepted_values: [approved, rejected], description: "Underwriting decision"}
      decision_ts: {type: timestamp, nullable: true, description: "Decision timestamp"}
      rejection_reason: {type: string, nullable: true, accepted_values: [thin_credit_file, low_bureau_score, insufficient_income, high_existing_obligations, risk_policy_cutoff, policy_ineligible, kyc_data_mismatch, fraud_suspected], description: "Primary rejection reason"}
      sanctioned_amount: {type: money, nullable: true, min: 0, description: "Approved principal (may be a counter-offer below the request)"}
      application_status: {type: string, nullable: false, accepted_values: [in_progress, abandoned, under_review, rejected, approved_pending, offer_expired, disbursed], description: "Lifecycle status at extract time"}
    date_order:
      - [started_ts, submitted_ts]
      - [submitted_ts, decision_ts]
    conditional:
      - {name: decided_has_timestamp, when: "decision.notna()", require_not_null: decision_ts, severity: warning}
      - {name: approved_has_amount, when: "decision == 'approved'", require_not_null: sanctioned_amount, severity: critical}

  loans:
    description: "Disbursed loans with current servicing state. Source: loan management system (LMS)."
    source_system: "LMS"
    grain: "One row per disbursed loan"
    primary_key: [loan_id]
    freshness_column: disbursed_ts
    columns:
      loan_id: {type: string, nullable: false, pattern: '^LN\d{7}$', description: "Loan identifier"}
      application_id: {type: string, nullable: false, severity: warning, fk: applications.application_id, description: "Originating application (lineage gaps are flagged, never dropped)"}
      customer_id: {type: string, nullable: false, fk: customers.customer_id, description: "Borrower"}
      product_id: {type: string, nullable: false, fk: products.product_id, description: "Product"}
      disbursed_ts: {type: timestamp, nullable: false, description: "Disbursal timestamp"}
      principal_amount: {type: money, nullable: false, min: 100, max: 1000000, description: "Sanctioned principal (INR)"}
      processing_fee: {type: money, nullable: false, min: 0, description: "Upfront fee deducted at disbursal (INR)"}
      net_disbursed_amount: {type: money, nullable: false, min: 0, description: "Principal minus processing fee, credited to the borrower"}
      interest_rate_apr: {type: float, nullable: false, min: 5, max: 60, description: "Annual interest rate (%)"}
      tenure_months: {type: integer, nullable: false, min: 1, max: 60, description: "Number of monthly instalments"}
      emi_amount: {type: money, nullable: false, min: 0, description: "Equated monthly instalment (INR)"}
      risk_band: {type: string, nullable: false, accepted_values: [A, B, C, D, E], description: "Risk band at origination"}
      autopay_enabled: {type: boolean, nullable: false, description: "NACH / UPI-Autopay mandate registered"}
      loan_sequence_number: {type: integer, nullable: false, min: 1, description: "1 = first loan for the customer"}
      is_repeat_loan: {type: boolean, nullable: false, description: "loan_sequence_number > 1"}
      maturity_date: {type: date, nullable: false, description: "Scheduled final instalment date"}
      loan_status: {type: string, nullable: false, accepted_values: [active, delinquent, npa, written_off, closed], description: "Servicing state at extract (NPA = 90+ DPD, written off = 180+ DPD)"}
      current_dpd: {type: integer, nullable: false, min: 0, description: "Days past due at extract"}
      max_dpd: {type: integer, nullable: false, min: 0, description: "Worst days past due ever observed"}
      outstanding_principal: {type: money, nullable: false, min: 0, description: "Principal outstanding at extract"}
      closed_date: {type: date, nullable: true, description: "Closure date (repaid or foreclosed)"}
      closure_type: {type: string, nullable: true, accepted_values: [repaid, foreclosure], description: "How the loan closed"}
    unique_together:
      - [application_id]
    cross_field:
      - {name: net_equals_principal_minus_fee, expr: "abs(net_disbursed_amount - (principal_amount - processing_fee)) < 1", severity: critical}
      - {name: current_le_max_dpd, expr: "current_dpd <= max_dpd", severity: critical}
      - {name: outstanding_le_principal, expr: "outstanding_principal <= principal_amount + 1", severity: critical}

  repayments:
    description: "Instalment schedule and payment outcome. Source: LMS repayment schedule."
    source_system: "LMS"
    grain: "One row per loan instalment"
    primary_key: [repayment_id]
    columns:
      repayment_id: {type: string, nullable: false, pattern: '^RP\d{8}$', description: "Instalment identifier"}
      loan_id: {type: string, nullable: false, fk: loans.loan_id, description: "Loan"}
      customer_id: {type: string, nullable: false, fk: customers.customer_id, description: "Borrower"}
      installment_number: {type: integer, nullable: false, min: 1, max: 60, description: "1..tenure"}
      due_date: {type: date, nullable: false, description: "Instalment due date"}
      principal_due: {type: money, nullable: false, min: 0, description: "Principal component of the EMI"}
      interest_due: {type: money, nullable: false, min: 0, description: "Interest component of the EMI"}
      total_due: {type: money, nullable: false, min: 0, description: "Total instalment amount"}
      amount_paid: {type: money, nullable: false, min: 0, outlier: true, description: "Amount received against the instalment"}
      principal_paid: {type: money, nullable: false, min: 0, description: "Principal portion received"}
      interest_paid: {type: money, nullable: false, min: 0, description: "Interest portion received (interest is allocated first)"}
      paid_date: {type: date, nullable: true, description: "Date the payment was received"}
      payment_status: {type: string, nullable: false, accepted_values: [scheduled, paid_on_time, paid_late, partially_paid, overdue], description: "Outcome at extract"}
      days_past_due: {type: integer, nullable: false, min: 0, description: "Days late at payment, or days overdue at extract if unpaid"}
      late_fee: {type: money, nullable: false, min: 0, description: "Late fee charged and collected"}
    unique_together:
      - [loan_id, installment_number]
    future_date_columns: [paid_date]
    cross_field:
      - {name: paid_le_due, expr: "amount_paid <= total_due * 1.01", severity: critical}
      - {name: components_sum, expr: "abs(total_due - principal_due - interest_due) < 0.05", severity: critical}

  transactions:
    description: "Money-movement ledger (disbursals, EMIs, fees, failed debits). Source: payment gateway webhooks."
    source_system: "Payments ledger"
    grain: "One row per payment attempt / ledger entry"
    primary_key: [transaction_id]
    freshness_column: txn_ts
    columns:
      transaction_id: {type: string, nullable: false, pattern: '^TX\d{9}$', description: "Ledger entry identifier"}
      customer_id: {type: string, nullable: false, fk: customers.customer_id, description: "Customer"}
      loan_id: {type: string, nullable: true, fk: loans.loan_id, description: "Loan the entry belongs to"}
      repayment_id: {type: string, nullable: true, fk: repayments.repayment_id, description: "Instalment paid (EMI and late-fee entries)"}
      txn_ts: {type: timestamp, nullable: false, description: "Ledger timestamp"}
      txn_type: {type: string, nullable: false, accepted_values: [disbursement, processing_fee, emi_payment, late_fee, foreclosure_payment, foreclosure_fee], description: "Entry type"}
      amount: {type: money, nullable: false, min: 0, outlier: true, description: "Amount (INR, always positive; direction implied by type)"}
      payment_method: {type: string, nullable: false, accepted_values: [imps_bank_transfer, deducted_at_source, nach_autodebit, upi_autopay, upi, netbanking, debit_card], description: "Rail used"}
      txn_status: {type: string, nullable: false, accepted_values: [success, failed], description: "Gateway outcome"}
      failure_reason: {type: string, nullable: true, accepted_values: [insufficient_funds, mandate_inactive, gateway_timeout, upi_txn_declined, bank_server_down], description: "Gateway failure code"}
    conditional:
      - {name: failed_has_reason, when: "txn_status == 'failed'", require_not_null: failure_reason, severity: warning}

  product_events:
    description: "Mixpanel-style product analytics event stream. Source: client SDK + server-side tracking."
    source_system: "Event tracking (Mixpanel export)"
    grain: "One row per tracked event"
    primary_key: [event_id]
    freshness_column: event_ts
    columns:
      event_id: {type: string, nullable: false, description: "Event insert id (dedup key)"}
      user_id: {type: string, nullable: false, fk: customers.customer_id, description: "distinct_id mapped to customer_id"}
      event_name: {type: string, nullable: false, accepted_values: [signup, login, kyc_started, kyc_completed, loan_application_started, loan_application_submitted, loan_approved, loan_rejected, loan_disbursed, payment_made, repeat_loan, support_contact, credit_score_viewed, emi_calculator_used, autopay_enabled, referral_shared], description: "Event name (see docs/event_taxonomy.md)"}
      event_ts: {type: timestamp, nullable: false, description: "Event time (IST)"}
      session_id: {type: string, nullable: true, description: "Client session (null for server-side events)"}
      platform: {type: string, nullable: false, accepted_values: [android, ios, web, server], description: "Emitting platform"}
      app_version: {type: string, nullable: true, description: "App build for mobile events"}
      properties: {type: string, nullable: false, description: "Event properties as JSON"}
      prop_product_id: {type: string, nullable: true, derived: true, description: "Flattened property: product_id"}
      prop_amount: {type: float, nullable: true, derived: true, description: "Flattened property: amount"}
      prop_variant: {type: string, nullable: true, derived: true, description: "Flattened property: experiment variant"}
      prop_reason: {type: string, nullable: true, derived: true, description: "Flattened property: rejection reason"}
      prop_category: {type: string, nullable: true, derived: true, description: "Flattened property: support category"}
      prop_method: {type: string, nullable: true, derived: true, description: "Flattened property: payment / login method"}
      prop_on_time: {type: boolean, nullable: true, derived: true, description: "Flattened property: payment on time"}
    future_date_columns: [event_ts]

  support_tickets:
    description: "Customer-support tickets. Source: helpdesk export."
    source_system: "Helpdesk"
    grain: "One row per ticket"
    primary_key: [ticket_id]
    freshness_column: created_ts
    columns:
      ticket_id: {type: string, nullable: false, pattern: '^TK\d{6}$', description: "Ticket identifier"}
      customer_id: {type: string, nullable: false, fk: customers.customer_id, description: "Customer"}
      loan_id: {type: string, nullable: true, fk: loans.loan_id, description: "Related loan, if any"}
      created_ts: {type: timestamp, nullable: false, description: "Ticket created"}
      channel: {type: string, nullable: false, accepted_values: [in_app_chat, email, phone, whatsapp], description: "Contact channel"}
      category: {type: string, nullable: false, accepted_values: [kyc_issue, application_status, disbursement_delay, payment_failure, collections, foreclosure_request, app_bug, general_query], description: "Ticket category"}
      priority: {type: string, nullable: false, accepted_values: [low, medium, high], description: "Priority"}
      first_response_minutes: {type: float, nullable: false, min: 0, outlier: true, description: "Minutes to first agent response"}
      resolved_ts: {type: timestamp, nullable: true, description: "Resolution timestamp (null = open)"}
      ticket_status: {type: string, nullable: false, accepted_values: [open, resolved, escalated_resolved], description: "Status at extract"}
      csat_score: {type: float, nullable: true, min: 1, max: 5, description: "Post-resolution CSAT (1-5)"}
    date_order:
      - [created_ts, resolved_ts]

  experiments:
    description: "Experiment registry (pre-registered design). Source: experimentation platform."
    source_system: "Experimentation platform"
    grain: "One row per experiment"
    primary_key: [experiment_id]
    columns:
      experiment_id: {type: string, nullable: false, pattern: '^EXP-', description: "Experiment identifier"}
      experiment_name: {type: string, nullable: false, description: "Name"}
      feature_area: {type: string, nullable: false, description: "Product area"}
      hypothesis: {type: string, nullable: false, description: "Pre-registered hypothesis"}
      unit: {type: string, nullable: false, accepted_values: [customer], description: "Randomisation unit"}
      allocation_pct: {type: integer, nullable: false, min: 1, max: 99, description: "% of eligible traffic in treatment"}
      start_date: {type: date, nullable: false, description: "Start"}
      end_date: {type: date, nullable: false, description: "End"}
      primary_metric: {type: string, nullable: false, description: "Decision metric"}
      secondary_metrics: {type: string, nullable: true, description: "Comma-separated secondary metrics"}
      guardrail_metrics: {type: string, nullable: true, description: "Comma-separated guardrails"}
      status: {type: string, nullable: false, description: "Lifecycle status"}
      owner_team: {type: string, nullable: false, description: "Owning team"}
    date_order:
      - [start_date, end_date]

  experiment_assignments:
    description: "Randomised exposure log. Source: experimentation platform."
    source_system: "Experimentation platform"
    grain: "One row per experiment x customer (first exposure)"
    primary_key: [assignment_id]
    columns:
      assignment_id: {type: string, nullable: false, pattern: '^AS\d{7}$', description: "Assignment identifier"}
      experiment_id: {type: string, nullable: false, fk: experiments.experiment_id, description: "Experiment"}
      customer_id: {type: string, nullable: false, fk: customers.customer_id, description: "Randomised customer"}
      variant: {type: string, nullable: false, accepted_values: [control, treatment], description: "Assigned arm"}
      assigned_ts: {type: timestamp, nullable: false, description: "First exposure"}
      platform: {type: string, nullable: false, accepted_values: [android, ios, web], description: "Platform at exposure"}
    unique_together:
      - [experiment_id, customer_id]

# Cross-table reconciliations (implemented in data_quality/reconciliations.py)
reconciliations:
  - {name: ledger_vs_repayments, severity: critical, description: "Successful EMI ledger entries per loan equal amount_paid in the repayment schedule (tolerance INR 1)"}
  - {name: disbursement_vs_loans, severity: critical, description: "Disbursement ledger amount equals loans.net_disbursed_amount"}
  - {name: loans_vs_applications, severity: warning, description: "Every disbursed application has exactly one loan"}
  - {name: kyc_events_vs_backend, severity: warning, description: "Daily kyc_completed events within 10% of backend KYC completions (instrumentation health)"}
  - {name: channel_vs_campaign, severity: warning, description: "Customer acquisition_channel agrees with the channel of its campaign tag (organic = no campaign)"}
